# llmgw 설정 예시 — 자체 호스팅 vLLM 1대 + 외부 API(Upstage) 1개를 묶는 샘플. 값은 예시다.
# 키 값은 여기 쓰지 않는다. api_key_env 에 환경변수 이름만 적는다.

log_path = "llmgw-requests.jsonl"   # 요청 1건당 JSONL 한 줄(본문 제외). 비우면 기록 안 함

[server]
addr = "127.0.0.1:17902"

# external provider 로 보내는 프롬프트의 주민번호·카드·전화·계좌·이메일·API 키를 [REDACTED:<종류>] 로 가린다.
[mask]
external = true
# kinds = ["rrn", "card", "phone", "account", "email", "secret"]   # 비우면 전부
# [mask.custom]
# employee_id = '\bE\d{6}\b'                                      # 추가 패턴(이름 → 정규식)

# ── 프로바이더 ─────────────────────────────────────────────────────────────

# 자체 호스팅 vLLM 예시. 동시 처리 수·대기열은 GPU 성능에 맞춰 조정한다.
# 긴 입력(1만 토큰+) prefill 은 합계 ~1,400 tok/s 로 고정이라 동시 수를 넉넉히 줘도 줄만 선다.
[providers.qwen]
base_url         = "http://localhost:8000/v1"
api_key_env      = "VLLM_API_KEY"
model            = "Qwen/Qwen3.8-27B-FP8"
reasoning        = "chat_template"   # enable_thinking on/off
json_schema      = true              # response_format json_schema 를 그대로 받는다
reasoning_min_tokens = 4096          # 추론 시 생각에 1~3K 토큰을 쓰므로 본문이 잘리지 않게
max_concurrency  = 12
max_queue        = 64
queue_timeout    = "60s"
timeout          = "180s"
breaker_failures = 5
breaker_cooldown = "30s"

# Upstage: 분당 100요청 한도를 다른 서비스와 같은 키로 나눠 쓰는 경우 → 여기선 절반만 쓴다.
[providers.upstage]
base_url         = "https://api.upstage.ai/v1"
api_key_env      = "UPSTAGE_API_KEY"
model            = "solar-pro4"
reasoning        = "effort"          # reasoning_effort 미지정 = 추론 안 함(0.6s급)
json_schema      = false             # json_schema 요청은 json_object 로 낮춰 보낸다
passthrough      = true              # /passthrough/upstage/... 로 문서 파싱 등 전용 API 도 중계
external         = true              # 외부로 나가는 provider — 외부 차단 요청·클라이언트는 건너뛴다
reasoning_min_tokens = 4096
rpm              = 50
max_concurrency  = 8
max_queue        = 16                # 넘치면 기다리지 않고 다음 step(qwen)으로
queue_timeout    = "15s"
timeout          = "60s"
breaker_failures = 3
breaker_cooldown = "60s"

# ── 라우트 ─────────────────────────────────────────────────────────────────
# steps 는 위에서부터 시도한다. 순서를 바꾸면 우선순위가 바뀐다.

# 대량·실시간: 뉴스 감정분류, 짧은 JSON. 추론 끔.
[routes.fast]
cache_ttl = "10m"
[[routes.fast.steps]]
provider   = "qwen"
reasoning  = "off"
max_tokens = 512
retries    = 2
[[routes.fast.steps]]
provider   = "upstage"
model      = "solar-mini4"
reasoning  = "off"
max_tokens = 512
retries    = 1

# 뉴스 심층 요약: solar-pro4(추론 끔, 2.2s, 품질 Qwen 추론급) → 막히면 Qwen 추론 켬(25s).
[routes.news-deep]
cache_ttl = "6h"
[routes.news-deep.validate]
min_chars    = 40
must_contain = ["요약", "영향"]
[[routes.news-deep.steps]]
provider   = "upstage"
reasoning  = "off"
max_tokens = 1024
retries    = 1
max_retry_wait = "5s"
[[routes.news-deep.steps]]
provider   = "qwen"
reasoning  = "on"
max_tokens = 4096
retries    = 1

# 추론이 필요한 분석: Qwen 추론 → Upstage 추론 high.
[routes.reason]
[[routes.reason.steps]]
provider   = "qwen"
reasoning  = "on"
retries    = 1
[[routes.reason.steps]]
provider   = "upstage"
reasoning  = "high"
retries    = 1

# ── 클라이언트 ─────────────────────────────────────────────────────────────
# 게이트웨이를 부르는 서비스마다 하나. Bearer 키로 식별하고, 라우트·한도·통계를 따로 둔다.
# clients 를 하나도 정의하지 않으면 인증 없이 전부 연다(127.0.0.1 전용일 때만).

# 사용자가 기다리는 실시간 앱: 한도 없이, 빠른 라우트만. 민감 데이터라 외부 provider 금지.
[clients.web-app]
api_key_env    = "LLMGW_KEY_WEB_APP"
routes         = ["fast", "news-deep"]
allow_external = false

# 야간 배치: 몰려도 다른 클라이언트 몫을 남기도록 동시 4, 대기 32
[clients.batch-worker]
api_key_env     = "LLMGW_KEY_BATCH"
routes          = ["fast", "news-deep"]
max_concurrency = 4
max_queue       = 32
queue_timeout   = "5m"

# 문서 위키 생성기: 추론 라우트 + Upstage 문서 파싱 중계 허용
[clients.wiki-builder]
api_key_env     = "LLMGW_KEY_WIKI"
routes          = ["*"]
passthrough     = ["upstage"]
rpm             = 30
